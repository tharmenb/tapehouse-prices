name: refresh-prices
on:
  schedule: [{cron: "5 20 * * 1-5"}]   # 20:05 UTC weekdays; add a second cron line for the post-close run if you like
  workflow_dispatch:
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python fetch_prices.py
        env: {ALPACA_KEY: "${{ secrets.ALPACA_KEY }}", ALPACA_SECRET: "${{ secrets.ALPACA_SECRET }}"}
      - run: python compute_signals.py
        env: {ALPACA_KEY: "${{ secrets.ALPACA_KEY }}", ALPACA_SECRET: "${{ secrets.ALPACA_SECRET }}"}
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add prices.json signals.json; git commit -m "prices and signals" || exit 0; git push
